name: Actualizar datos UCL
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7,13,19 * * *' # tres veces al día UTC
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Descargar y validar datos reales
        env:
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
        run: python scripts/update_data.py
      - name: Guardar cambios si hubo actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Actualizar datos UCL automáticamente"
          git push
